name: Docker Publish

on:
  push:
    branches:
      - main
      - develop
    paths:
      - Dockerfile
      - package.json
      - tsconfig.json
      - src/**
      - .github/workflows/docker-publish.yml
  workflow_dispatch:

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: superpck/his-connect

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract app version
        id: appver
        run: |
          VERSION=$(jq -r '.version' package.json)
          SUB_VERSION=$(jq -r '.subVersion' package.json)
          FULL_VERSION="${VERSION}-${SUB_VERSION}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sub_version=$SUB_VERSION" >> "$GITHUB_OUTPUT"
          echo "full_version=$FULL_VERSION" >> "$GITHUB_OUTPUT"

      - name: Docker Hub login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.appver.outputs.full_version }}
            type=raw,value=latest,enable=${{ github.ref_name == 'main' }}
            type=raw,value=linux-latest,enable=${{ github.ref_name == 'main' }}
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "Published image tags:" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
