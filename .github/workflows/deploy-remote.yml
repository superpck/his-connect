name: Deploy Remote Compose

on:
  workflow_dispatch:
    inputs:
      compose_path:
        description: Path on remote host that contains docker-compose.yml
        required: true
        default: /app_data/api/his-connect/his_connect_docker
      service_name:
        description: Compose service to update
        required: true
        default: api
      compose_file:
        description: Compose filename
        required: true
        default: docker-compose.yml

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          script_stop: true
          script: |
            set -euo pipefail
            cd "${{ github.event.inputs.compose_path }}"
            docker compose -f "${{ github.event.inputs.compose_file }}" pull "${{ github.event.inputs.service_name }}"
            docker compose -f "${{ github.event.inputs.compose_file }}" up -d "${{ github.event.inputs.service_name }}"
            docker compose -f "${{ github.event.inputs.compose_file }}" ps
