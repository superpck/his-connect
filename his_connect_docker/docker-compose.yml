x-auto-update: &auto_update "true"   # เปลี่ยนเป็น "false" เพื่อปิด auto update ของ api

services:
  api:
    image: superpck/his-connect:linux-latest
    container_name: his-connect-api
    environment:
      TZ: Asia/Bangkok
    ports:
      - "3004:3004"
    volumes:
      - ./config:/usr/src/his_connect/config:ro
      - ./sent_result.txt:/usr/src/his_connect/sent_result.txt
    command: ["pm2-runtime", "start", "app/app.js", "-i", "2", "--name", "his-connect-docker"]
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3004"]
      interval: 30s
      timeout: 10s
      retries: 5
    labels:
      com.centurylinklabs.watchtower.enable: *auto_update

  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    restart: always
    profiles: ["autoupdate"]
    environment:
      TZ: Asia/Bangkok
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command:
      - --label-enable
      - --schedule
      - "0 0 3 * * *"
      - --cleanup
      - --rolling-restart